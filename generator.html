<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Link Generator Undangan - Dimas & Diva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F0F4F8; color: #243B53; }
  </style>
</head>
<body class="p-4 sm:p-8">
  <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-slate-200">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-800 text-white text-xl mb-3">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">WhatsApp Link Generator</h1>
      <p class="text-xs text-slate-500 mt-1">Alat bantu praktis membuat pesan & link undangan untuk tiap tamu</p>
    </div>

    <!-- 1. Domain / URL Website -->
    <div class="mb-4">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
        1. Link Website Undangan Anda (Setelah di-hosting)
      </label>
      <input type="text" id="baseUrl" value="https://dimasdiva.vercel.app" placeholder="Contoh: https://dimasdiva.vercel.app" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-slate-700 outline-none text-sm text-slate-800">
      <p class="text-[11px] text-slate-400 mt-1">*Jika belum di-hosting dan ingin coba lokal, biarkan saja contoh di atas.</p>
    </div>

    <!-- 2. Nama Tamu -->
    <div class="mb-4">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
        2. Nama Tamu Undangan
      </label>
      <input type="text" id="guestName" oninput="generateMessage()" placeholder="Contoh: Budi Santoso & Keluarga" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-slate-700 outline-none text-sm text-slate-800 font-medium">
    </div>

    <!-- 3. Nomor WhatsApp Tamu (Opsional) -->
    <div class="mb-5">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
        3. No. WhatsApp Tamu (Opsional, awalan 62 atau 08)
      </label>
      <input type="tel" id="guestPhone" oninput="generateMessage()" placeholder="Contoh: 08123456789 atau 628123456789" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-slate-700 outline-none text-sm text-slate-800">
    </div>

    <hr class="my-6 border-slate-200">

    <!-- Preview Pesan WhatsApp -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Pratinjau Pesan WhatsApp</label>
        <span class="text-[11px] text-emerald-600 font-semibold"><i class="fa-brands fa-whatsapp"></i> Format Siap Kirim</span>
      </div>
      <textarea id="messagePreview" rows="8" readonly class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-700 font-mono leading-relaxed select-all"></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button onclick="copyMessage()" class="w-full py-3 rounded-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold flex items-center justify-center gap-2 shadow-md transition-all">
        <i class="fa-regular fa-copy"></i>
        <span>Salin Teks Pesan</span>
      </button>

      <button onclick="sendToWhatsApp()" class="w-full py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center justify-center gap-2 shadow-md transition-all">
        <i class="fa-brands fa-whatsapp text-sm"></i>
        <span>Kirim ke WhatsApp</span>
      </button>
    </div>

    <!-- Link URL Langsung -->
    <div class="mt-5 p-3 rounded-xl bg-slate-100 flex items-center justify-between text-xs">
      <span class="text-slate-500 truncate mr-2" id="directLinkDisplay">Link: https://...</span>
      <button onclick="copyDirectLink()" class="shrink-0 text-slate-700 font-bold hover:text-slate-900 text-[11px] underline">
        Salin Link Saja
      </button>
    </div>

  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-5 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
    Berhasil disalin ke clipboard!
  </div>

  <script>
    function generateMessage() {
      let baseUrl = document.getElementById('baseUrl').value.trim() || 'https://dimasdiva.vercel.app';
      if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

      const guestName = document.getElementById('guestName').value.trim() || 'Bapak/Ibu/Saudara/i';
      const encodedName = encodeURIComponent(guestName);
      const link = `${baseUrl}/?to=${encodedName}`;

      document.getElementById('directLinkDisplay').innerText = `Link: ${link}`;

      const text = `Kepada Yth.
Bapak/Ibu/Saudara/i: *${guestName}*

_Assalamu’alaikum Warahmatullahi Wabarakatuh_

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

*Prasetya Dimas Arvianto & Diva Danica*
(Dimas & Diva)

🗓 *Minggu, 8 November 2026*
📍 *Jakasampurna, Bekasi Barat*

Untuk informasi lengkap mengenai detail acara, lokasi, dan konfirmasi kehadiran, silakan kunjungi tautan undangan online kami berikut:

🔗 ${link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.

Terima kasih.
_Wassalamu’alaikum Warahmatullahi Wabarakatuh_

Kami yang berbahagia,
*Dimas & Diva*`;

      document.getElementById('messagePreview').value = text;
    }

    function copyMessage() {
      const msg = document.getElementById('messagePreview').value;
      navigator.clipboard.writeText(msg).then(() => {
        showToast('Pesan WhatsApp berhasil disalin!');
      });
    }

    function copyDirectLink() {
      let baseUrl = document.getElementById('baseUrl').value.trim() || 'https://dimasdiva.vercel.app';
      if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
      const guestName = document.getElementById('guestName').value.trim() || 'Tamu Undangan';
      const link = `${baseUrl}/?to=${encodeURIComponent(guestName)}`;
      navigator.clipboard.writeText(link).then(() => {
        showToast('Link undangan berhasil disalin!');
      });
    }

    function sendToWhatsApp() {
      let phone = document.getElementById('guestPhone').value.trim();
      const msg = encodeURIComponent(document.getElementById('messagePreview').value);

      if (phone.startsWith('08')) {
        phone = '62' + phone.substring(1);
      } else if (phone.startsWith('+62')) {
        phone = phone.substring(1);
      }

      let waUrl = '';
      if (phone) {
        waUrl = `https://api.whatsapp.com/send?phone=${phone}&text=${msg}`;
      } else {
        waUrl = `https://api.whatsapp.com/send?text=${msg}`;
      }

      window.open(waUrl, '_blank');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // Init
    generateMessage();
  </script>
</body>
</html>
